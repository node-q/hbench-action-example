name: Run an agent

on:
  workflow_dispatch:
    inputs:
      agent:
        description: Agent
        type: choice
        options: [claude-code, codex, gemini-cli, deepseek-harness]
        default: claude-code
      model:
        description: Model, as provider/name
        type: string
        default: anthropic/claude-opus-5-5
      n-attempts:
        description: Attempts per task
        type: string
        default: '1'

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.agent }} on this repository's tasks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: node-q/hbench-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          path: tasks
          agent: ${{ inputs.agent }}
          model: ${{ inputs.model }}
          n-attempts: ${{ inputs.n-attempts }}
          n-concurrent: 3
